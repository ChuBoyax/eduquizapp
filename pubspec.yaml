name: eduquiz_app
description: "EduQuiz - Interactive Quiz Platform for Teachers and Students"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP requests para sa Laravel API
  dio: ^5.7.0

  # Local storage (para sa token at user data)
  shared_preferences: ^2.3.2

  # Navigation
  go_router: ^14.6.0

  # UI helpers
  flutter_spinkit: ^5.2.1
  fluttertoast: ^8.2.8

  # QR Code display (para sa room code)
  qr_flutter: ^4.1.0

  # Animations
  animate_do: ^3.3.4

  # Icons
  iconsax: ^0.0.8
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true